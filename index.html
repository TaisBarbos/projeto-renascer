<!-- Seção: Seletor de Jornada -->
<section class="container-sec quiz-bg">
    <h2 class="section-title">Escolha a sua jornada atual</h2>
    <p class="quiz-subtitle">Clique no momento que mais representa o seu desafio de hoje:</p>
    
    <div class="quiz-container">
        <button class="quiz-card" onclick="selecionarJornada('rotina')">
            <strong>🌱 Jornada Respiro & Rotina</strong>
            <p>Sinto que estou sempre apagando incêndios e preciso reorganizar meu tempo sem culpa.</p>
        </button>

        <button class="quiz-card" onclick="selecionarJornada('recomeco')">
            <strong>🚀 Jornada Recomeço Profissional</strong>
            <p>Quero voltar a trabalhar ou crescer na minha carreira, mas não sei por onde começar.</p>
        </button>

        <button class="quiz-card" onclick="selecionarJornada('autonomia')">
            <strong>✨ Jornada Autonomia & Propósito</strong>
            <p>Quero resgatar minha identidade além da maternidade e construir meus próprios projetos.</p>
        </button>

        <!-- Painel de Destino da Jornada -->
        <div id="quiz-result">
            <h3 id="jornada-titulo">Sua jornada começa aqui</h3>
            <p id="result-text"></p>
            <a href="#" class="btn btn-result">Quero dar esse passo na minha jornada</a>
        </div>
    </div>
</section>
